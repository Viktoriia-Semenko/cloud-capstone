name: Milestone 2 CD

on:
  workflow_dispatch:
    inputs:
      allowed_client_cidr:
        description: "Your public IPv4 CIDR, e.g. 203.0.113.10/32"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: capstone-aws-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Validate infrastructure templates
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/network.yaml

          aws cloudformation validate-template \
            --template-body file://infra/application.yaml

      - name: Deploy network
        run: |
          aws cloudformation deploy \
            --template-file infra/network.yaml \
            --stack-name capstone-network \
            --no-fail-on-empty-changeset

      - name: Deploy application
        env:
          CLIENT_CIDR: ${{ inputs.allowed_client_cidr }}
          CODE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$CLIENT_CIDR" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}/32$ ]]; then
            echo "Expected IPv4 address with /32"
            exit 1
          fi

          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name capstone-network \
            --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue | [0]" \
            --output text)

          SUBNET_ID=$(aws cloudformation describe-stacks \
            --stack-name capstone-network \
            --query "Stacks[0].Outputs[?OutputKey=='PublicSubnetId'].OutputValue | [0]" \
            --output text)

          # Replace the application so EC2 UserData runs again.
          if aws cloudformation describe-stacks \
            --stack-name capstone-application >/dev/null 2>&1; then

            aws cloudformation delete-stack \
              --stack-name capstone-application

            aws cloudformation wait stack-delete-complete \
              --stack-name capstone-application
          fi

          aws cloudformation deploy \
            --template-file infra/application.yaml \
            --stack-name capstone-application \
            --parameter-overrides \
              "VpcId=$VPC_ID" \
              "PublicSubnetId=$SUBNET_ID" \
              "AllowedClientCidr=$CLIENT_CIDR" \
              "CodeRevision=$CODE_REVISION"

          aws cloudformation describe-stacks \
            --stack-name capstone-application \
            --query 'Stacks[0].Outputs' \
            --output table
